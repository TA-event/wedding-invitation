<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toý çakylygy | Azat & Gülşirin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            background: #070707; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 40%);
            color: #f0f0f0; 
            text-align: center; 
            padding: 25px 15px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .container { 
            max-width: 420px; 
            width: 100%;
            margin: 0 auto; 
            background: rgba(18, 18, 18, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            padding: 40px 24px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(212, 175, 55, 0.3); 
            position: relative;
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 18px;
            pointer-events: none;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .invitation-badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #d4af37;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* --- ИДЕАЛЬНО СБАЛАНСИРОВАННОЕ СЕРДЦЕ --- */
        .heart-box {
            position: relative;
            width: 130px;
            height: 115px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseGlow 3s infinite alternate;
        }

        .heart-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: url(#goldGradient);
            stroke-width: 2.2;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.45));
        }

        .heart-initials {
            position: relative;
            z-index: 2;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff2b2 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            padding-bottom: 8px; /* Центрирование с учетом формы сердца */
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.3)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.65)); }
        }
        /* -------------------------------------- */

        h1 { 
            font-family: 'Cinzel', serif;
            font-size: 32px; 
            background: linear-gradient(135deg, #fff2b2 0%, #d4af37 50%, #aa822c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px; 
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 22px auto;
        }

        p { 
            font-size: 14px; 
            color: #cccccc; 
            margin-bottom: 25px; 
            line-height: 1.7; 
            font-weight: 300;
            padding: 0 5px;
        }

        .video-box { 
            width: 100%; 
            border-radius: 14px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            background: #000; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        video { 
            width: 100%; 
            display: block; 
        }

        .details-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .details-box p {
            margin-bottom: 0;
            color: #e0e0e0;
            font-size: 13px;
        }

        .details-box b {
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn { 
            display: block; 
            width: 100%; 
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa822c 100%); 
            color: #0c0c0c; 
            padding: 15px; 
            border-radius: 12px; 
            font-weight: 700; 
            text-decoration: none; 
            margin-bottom: 12px; 
            font-size: 13px; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
            transition: all 0.3s ease; 
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
        }

        .btn:active { 
            transform: translateY(1px); 
        }

        .btn-outline { 
            background: transparent; 
            border: 1px solid rgba(212, 175, 55, 0.5); 
            color: #f3e5ab; 
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="heart-box">

                <defs>

                        <stop offset="0%" stop-color="#fff2b2" />

        <!-- Видео-поздравление -->

    </div>

</body>
</html>
